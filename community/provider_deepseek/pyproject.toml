[project]
name = "provider_deepseek"
version = "0.1.0"
description = "DeepSeek LLM provider (OpenAI-compatible) for machine-core"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["provider_deepseek"]

[tool.hatch.build.targets.wheel.force-include]
"manifest.json" = "provider_deepseek/manifest.json"
