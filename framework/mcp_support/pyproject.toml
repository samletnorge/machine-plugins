[project]
name = "mcp_support"
version = "0.6.0"
description = "Connect to Model Context Protocol servers and expose their tools"
requires-python = ">=3.12"
dependencies = ["mcp>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_support"]

[tool.hatch.build.targets.wheel.force-include]
"manifest.json" = "mcp_support/manifest.json"
