[project]
name = "agent_assistant"
version = "0.1.0"
description = "General chat agent backed by a model provider (DeepSeek by default)"
requires-python = ">=3.12"
dependencies = ["model_provider_support"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_assistant"]

[tool.hatch.build.targets.wheel.force-include]
"manifest.json" = "agent_assistant/manifest.json"
