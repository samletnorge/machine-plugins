{% extends "base.html" %}
{% block content %}
<section class="content-grid">
    <article class="panel">
        <header class="chat-page-header">
            <div>
                <span class="eyebrow">Control plane</span>
                <h3>{{ section_title }}</h3>
            </div>
            <p class="muted">{{ section_description }}</p>
        </header>
        <div
            id="{{ island_domain }}-island"
            data-endpoint="{{ request.scope.root_path }}{{ island_endpoint }}"
        ></div>
    </article>
</section>
<script type="module" src="{{ request.scope.root_path }}/static/{{ island_domain }}.js"></script>
{% endblock %}
