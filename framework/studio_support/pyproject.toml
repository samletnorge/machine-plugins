[project]
name = "studio_support"
version = "0.2.0"
description = "Visual studio/playground for machine-core"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.0",
    "markdown-it-py>=3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio_support"]

[tool.hatch.build.targets.wheel.force-include]
"manifest.json" = "studio_support/manifest.json"
