[project]
name = "processor_support"
version = "0.5.0"
description = "Defines the processor category for data processors"
requires-python = ">=3.12"
dependencies = ["tiktoken>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["processor_support"]

[tool.hatch.build.targets.wheel.force-include]
"manifest.json" = "processor_support/manifest.json"
